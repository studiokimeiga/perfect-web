[workspace]
resolver = "3"
members = [
    "compiler/pw-core",
    "compiler/pw-cli",
    "compiler/pw-conformance",
    "compiler/pw-syntax",
    "runtime/pw-document",
    "runtime/pw-host",
    "runtime/pw-materialize",
    "runtime/pw-outbound",
    "runtime/pw-protocol",
    "runtime/pw-render",
    "runtime/pw-render-wasm",
    "runtime/pw-resource",
    "runtime/pw-resume",
    "runtime/pw-resume-wasm",
    "runtime/pw-table-memory",
    "runtime/pw-tasks",
    "runtime/pw-time",
    "spikes/compiler-diagnostic",
    "spikes/kiokun/server",
    "spikes/own-renderer/server",
    "tools/corpus-check",
    "tools/fuzz",
]
# spikes/wasmtime-component/{host,guest} are intentionally NOT workspace members:
# the guest targets wasm32-wasip2 and must not be pulled into a host-target
# `cargo test --workspace`. They are built by spikes/wasmtime-component/run.sh.
exclude = [
    "spikes/wasmtime-component/host",
    "spikes/wasmtime-component/guest",
    "spikes/wasmtime-component/guest-minimal",
]

# `runtime/pw-tasks` is E2A-R (ADR-0016). The rest of the `runtime/` tree
# arrives with the milestone that needs it: charter §12 says "Do not create
# empty directories merely to look complete".

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "local-only"
publish = false

[workspace.dependencies]
# Verified on crates.io 2026-08-05. See docs/DECISIONS/ADR-0009-parser-and-diagnostics-stack.md
# annotate-snippets is the renderer rustc itself uses; MIT OR Apache-2.0.
annotate-snippets = "0.12.16"
# ADR-0012 — lossless syntax tree. Verified on crates.io 2026-08-05.
rowan = "0.17.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Wasmtime host + guest bindings for spikes/wasmtime-component (Milestone 0 task 10).
wasmtime = "48.0.7"
wasmtime-wasi = "48.0.7"
wit-bindgen = "0.60.0"
# E6's materializer store and transactional outbox (ADR-0019). Verified on
# crates.io 2026-08-06: 0.40.1, MIT. `bundled` compiles SQLite from source, so
# the version is the crate's rather than the host's — `tools/versions.lock`
# exists to stop a measurement being a measurement of one machine's macOS.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# E7-R's instance-token PRF (architect ruling, 2026-08-06: a keyed
# cryptographic derivation, not FNV). Verified on crates.io 2026-08-06: 1.8.6,
# CC0-1.0 OR Apache-2.0. `keyed_hash` IS the PRF, so nothing here composes a
# construction by hand.
blake3 = "1.8.6"
# ADR-0158: a test's directory, removed when the test is done with it. Already
# in the graph through wasmtime. Verified on crates.io 2026-10-03: 3.27.0, the
# newest, not yanked, MIT OR Apache-2.0; its API (`TempDir::with_prefix`,
# `path`, deleting on drop) checked against docs.rs for 3.27.0.
tempfile = "3.27.0"
# The feed's PostgreSQL data layer (ADR-0246, a feed on PostgreSQL). Verified
# on crates.io 2026-10-07: 0.19.14, the newest, not yanked, MIT OR Apache-2.0,
# rust-version 1.85; rust-postgres's synchronous client over tokio-postgres
# 0.7.18, pure Rust (no libpq). Its API (`Client::connect`, `NoTls`,
# `build_transaction().isolation_level(..).start()`, `Transaction::commit`)
# checked against docs.rs for 0.19.14 and the crate's source.
postgres = "=0.19.14"
# The identity track's development provider (track `identity`, ADR-0258):
# argon2 0.6.0 (RustCrypto, 2026-08-27), the newest on crates.io and not
# yanked, MIT OR Apache-2.0, rust-version 1.85; checked 2026-10-07, and its
# download approved by the owner that day. Argon2id v19 at the crate's
# defaults (19 MiB, two iterations, one lane), its hashes PHC strings
# (`PasswordHasher::hash_password`, `phc::PasswordHash::new`,
# `PasswordVerifier::verify_password`, checked on docs.rs for 0.6.0 and in
# the crate's source). A password is kept only as its hash.
argon2 = "=0.6.0"
# The identity track's ids and PKCE (ADR-0258), each already in the graph
# before the track, so nothing downloaded: sha2 0.11.0, PKCE's S256 (RFC 7636
# §4.2); getrandom 0.4.3, the operating system's random source for session
# ids, states, nonces and codes; base64 0.22.1, base64url without padding
# (RFC 4648 §5), `engine::general_purpose::URL_SAFE_NO_PAD`.
base64 = "=0.22.1"
getrandom = "=0.4.3"
# The uploads track (ADR-0260) takes sha2 0.11.0 too, for a blob's key: the
# SHA-256 of its bytes (`Sha256::digest`, checked in the crate's README and
# source).
sha2 = "=0.11.0"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser's WebAssembly (ADR-0130): `pw-render-wasm` and `pw-resume-wasm`,
# downloaded by a page, so built for size. `release` stays as it is for the
# native binaries.
[profile.browser]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true
