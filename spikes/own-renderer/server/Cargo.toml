[package]
name = "pw-dev-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# E7-P's development host. NOT E8's production host.
#
# Its deletion condition is explicit: E8 replaces it with the
# capability-constrained production host while preserving the `pw-protocol`
# browser boundary. Saying that here is what stops a temporary adapter quietly
# becoming architecture.

[features]
# Explicit actualPG gate; selected tests fail setup when their database is absent.
scheduler-postgres-tests = []
session-postgres-tests = []

[dependencies]
pw-document = { path = "../../../runtime/pw-document" }
# E8's host, in E7-P's dev server. The deletion condition above says E8 replaces
# this server; until it does, the COMMAND PATH at least stops having ambient
# authority — `admit` decides, and a refusal is a refusal.
# With the engine since E10-I: `add_to_cart` and `clear_cart` run as the
# components the compiler built from `examples/store/app.pw`, through the host.
pw-host = { path = "../../../runtime/pw-host", features = ["engine"] }
pw-materialize = { path = "../../../runtime/pw-materialize" }
pw-protocol = { path = "../../../runtime/pw-protocol" }
pw-render = { path = "../../../runtime/pw-render" }
pw-resource = { path = "../../../runtime/pw-resource" }
# ADR-0304: the host's tz database, read for the platform's clock.
pw-time = { path = "../../../runtime/pw-time" }
# Track outbound-https (ADR-0387): the host's one outbound client, which the
# payments reach their provider with.
pw-outbound = { path = "../../../runtime/pw-outbound" }
# The feed's data in PostgreSQL, where the deployment names one
# (`PW_FEED_DATABASE_URL`); the in-memory layer otherwise.
postgres.workspace = true
# The identity track (ADR-0258): the development provider's password hashes.
argon2.workspace = true
# The identity track (ADR-0258): PKCE's S256, and session ids, states and
# codes from the operating system's random source.
base64.workspace = true
getrandom.workspace = true
# The identity track's PKCE, and the uploads track's (ADR-0260) blob keys,
# the SHA-256 of their bytes.
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
# Track `kiokun` (W6): kiokun stores each word as raw DEFLATE. The crate
# kiokun's slice host already takes (spikes/kiokun/server), at the version in
# Cargo.lock: 0.9.1, MIT OR Zlib OR Apache-2.0, checked on crates.io
# 2026-09-25.
miniz_oxide = "0.9.1"
# Track `kiokun` (W6): kiokun.com's search is an FTS5 table, which the
# workspace's bundled SQLite builds with (libsqlite3-sys's
# `-DSQLITE_ENABLE_FTS5`). The workspace's crate, already in Cargo.lock
# through pw-materialize; no new crate.
rusqlite.workspace = true

[dev-dependencies]
# Track outbound-https (ADR-0387): a test's certificate authority and TLS
# front, for the payments at an https origin; a dev-dependency alone.
pw-outbound-testkit = { path = "../../../runtime/pw-outbound-testkit" }
# ADR-0158: a test leaves nothing behind.
tempfile.workspace = true
# ADR-0145: a test builds a program with the compiler, as `pw build` builds
# it, and serves what was built.
pw-core = { path = "../../../compiler/pw-core" }
pw-syntax = { path = "../../../compiler/pw-syntax" }
