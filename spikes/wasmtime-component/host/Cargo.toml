[package]
name = "spike-wasmtime-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

# Not a workspace member — see the root Cargo.toml `exclude`. This crate is built
# by spikes/wasmtime-component/run.sh, which first builds the wasm32-wasip2 guest.

[[bin]]
name = "spike-wasmtime-host"
path = "src/main.rs"

[dependencies]
# Excluded workspace: keep the same audited default-minus-cache feature list.
wasmtime = { version = "48.0.7", default-features = false, features = ["anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "component-model-async", "threads", "stack-switching", "std", "debug", "compile-time-builtins", "wit-parser"] }
anyhow = "1.0.104"
