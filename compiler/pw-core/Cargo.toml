[package]
name = "pw-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# E1A — `pw`-owned value semantics and boundary ABI (ADR-0011).
#
# This is the first code that belongs to the LANGUAGE rather than to a spike.
# It exists because E0 measured that Koka does not provide effect-independent
# exhaustiveness, nominal runtime identity, or a generic Result<T, E>.

[dependencies]
pw-syntax = { path = "../pw-syntax" }
annotate-snippets.workspace = true
serde.workspace = true
serde_json.workspace = true

# E10-A — core Wasm encoding. `wasm-encoder` is the encoder half of the
# `wasm-tools` pair whose parser half (`wit-parser`, `wasmparser`) this crate
# already trusts to check its output, so the two sides of every E10 gate come
# from one upstream.
#
# Verified against crates.io on 2026-08-19: 0.257.1 is the newest published
# version of `wasm-encoder`, `wasmparser` and `wit-parser` alike. `wit-parser`
# moves to it here so the three cannot drift — they are released in lockstep and
# a mixed set is a set nobody upstream tests.
wasm-encoder = "0.257.1"

# E10-I — the component. Architect ruling, 2026-08-20: *do not hand-implement
# the Component Model binary format. Pleris owns the lowering facts; upstream
# owns the component-format encoding.* `wit-component` is that upstream, and
# 0.257.1 depends on exactly `wit-parser`, `wasm-encoder` and `wasmparser`
# 0.257.1 — the set this crate already pins (crates.io, checked 2026-09-24:
# released 2026-08-19, not yanked, license Apache-2.0 WITH LLVM-exception OR
# Apache-2.0 OR MIT). Every Canonical ABI number — flattening, sizes,
# alignments, mangled names — is read from `wit-parser`, which is now a
# normal dependency for that reason: the ABI's facts are no longer only
# checked here, they are consumed.
wit-component = "0.257.1"
wit-parser = "0.262.0"
# The core module's own import list, read back from the bytes the encoder
# produced rather than from what the encoder meant to produce.
wasmparser = "0.257.1"

[dev-dependencies]
# ADR-0158: a test leaves nothing behind.
tempfile.workspace = true
# ADR-0203: a view that contains itself, compiled here and rendered by the
# renderer the hosts use, in one test. A workspace path: nothing is fetched.
pw-render = { path = "../../runtime/pw-render" }

# Track evidence-integrity, finding 4: `check_latency` bounds the checking
# thread's CPU time, `clock_gettime(CLOCK_THREAD_CPUTIME_ID)`, where a loaded
# machine stretched the wall clock past the ceiling. 0.2.189 was in Cargo.lock
# already (wasmtime, tokio, rustix and others depend on it) and in the local
# registry, so nothing is fetched; its own source declares both on Linux and
# Apple targets (checked 2026-10-15). License MIT OR Apache-2.0.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
libc = "0.2.189"
