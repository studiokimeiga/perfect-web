<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>input buttons</title></head>
<body>
<form>
  <input id="reset" type="reset">
  <input id="reset-value" type="reset" value="Clear the search">
  <input id="reset-empty" type="reset" value="">
  <input id="submit" type="submit">
  <input id="submit-empty" type="submit" value="">
  <input id="submit-blank" type="submit" value="  ">
  <input id="submit-empty-aria" type="submit" value="" aria-label="Search">
  <input id="button" type="button">
  <input id="button-value" type="button" value="Send">
  <input id="button-empty" type="button" value="">
  <label>Close <input id="button-label" type="button"></label>
  <input id="image-alt" type="image" src="missing.png" alt="Search">
  <input id="image-noalt" type="image" src="missing.png">
  <input id="image-emptyalt" type="image" src="missing.png" alt="">
  <input id="image-aria" type="image" src="missing.png" aria-label="Search">
  <input id="image-upper" type="IMAGE" src="missing.png" alt="Go">
</form>
</body>
</html>
