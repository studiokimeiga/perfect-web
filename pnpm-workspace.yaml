packages:
  - "spikes/marko-stream-resume"
  # E3: routes here are GENERATED from `.pw` by `pw emit-marko` (ADR-0017).
  - "spikes/pw-to-marko"
  # E7 task 2: the OWN renderer. Marko is not a dependency of this one — the
  # pages are static files `pw-render` produced, and the only devDependency is
  # the browser harness that reads them.
  - "spikes/own-renderer"
  # E14-A: the canonical store in Next.js and SvelteKit, the baselines the AI
  # benchmark compares Pleris against (ADR-0120). In the workspace so that
  # `just audit` scans their dependency trees too (charter §3.6).
  - "benchmarks/baselines/next-react"
  - "benchmarks/baselines/sveltekit"
  - "benchmarks/harness"
  # The head-to-head (ADR-XXXX): its instrument and specs, on the pinned
  # Playwright; it measures the vendored TodoMVC apps and the baselines above.
  - "benchmarks/headtohead"
  # Track `todomvc` (W7): TodoMVC's own Cypress suite, vendored unchanged and
  # run against TodoMVC in Pleris (`spikes/todomvc-cypress`). In the workspace
  # so that `just audit` scans Cypress's dependency tree too (charter §3.6).
  - "spikes/todomvc-cypress"
  # runtime/*, benchmarks/baselines/* and examples/* join as milestones need them
  # (PROJECT_CHARTER.md §12: do not create empty directories to look complete).
