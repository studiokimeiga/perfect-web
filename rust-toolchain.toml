# Pinned Rust toolchain for the `perfect-web` workspace.
#
# Verified against https://static.rust-lang.org/dist/channel-rust-stable.toml on 2026-08-05:
#   stable = 1.97.1 (8bab26f4f 2026-07-14)
#
# PROJECT_CHARTER.md §3.6 requires pinned versions and committed lockfiles.
# PROJECT_CHARTER.md §13.2 requires rustup + rust-toolchain.toml.
#
# `wasm32-wasip2` is required by spikes/wasmtime-component (Milestone 0 task 10)
# and by the eventual edge/origin component backend (Milestone 8, Milestone 10).
# `wasm32-unknown-unknown` builds the browser's WebAssembly, `pw-resume-wasm`
# (`spikes/own-renderer/run.sh`). It was installed on the
# development machine by hand and listed nowhere, until the first verification
# run on a fresh runner could not build it (ADR-0245).
#
# `llvm-tools` is `llvm-profdata`, which the coverage-guided fuzzer
# (`tools/fuzz`, `just fuzz`) reads its coverage with, from the toolchain's own
# `lib/rustlib/<host>/bin/`. Nothing listed it, and the fuzzer looked for it at
# one machine's own path, so everywhere else it measured nothing and reported
# success (found 2026-10-20; track fuzz-floor, ADR-0360). The
# channel manifest names the component `llvm-tools-preview` and renames
# `llvm-tools` to it, as it does `clippy` and `rustfmt`. A fresh install
# fetches 39 MB more (x86_64; 31 MB on arm64) and unpacks 225 MB more.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["wasm32-wasip2", "wasm32-unknown-unknown"]
profile = "minimal"
