name: Temporary Wasmtime lockfile repair
on:
  push:
    branches:
      - fix/verify-census-table-fixture-20261101
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve patched Wasmtime
        run: |
          cargo update -p wasmtime --precise 48.0.8
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --stat -- Cargo.lock
      - name: Commit repaired lockfile and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/_temporary-wasmtime-lockfile.yml
          git commit -m "Regenerate lockfile for security-patched Wasmtime 48.0.8"
          git push origin HEAD:fix/verify-census-table-fixture-20261101
