# Opt-in research; do not turn this into a required gate without
# comparing its kills/coverage against Pleris's existing tailored mutations.
name: Rust test-strength pilot

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Allowlisted crate to analyze on the selected ref"
        required: true
        type: choice
        options:
          - pw-table-memory
          - pw-core
          - pw-resource
      run_mutants:
        description: "Run changed-line mutants after coverage (expensive)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pilot:
    name: Changed Rust coverage and mutation pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage of chosen crate
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in pw-table-memory|pw-core|pw-resource) ;; *) exit 2;; esac
          cargo llvm-cov --package "$PACKAGE" --tests --summary-only | tee coverage.txt
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        if: inputs.run_mutants
        with:
          tool: cargo-mutants
      - name: Mutants only in changed Rust
        if: inputs.run_mutants
        continue-on-error: true
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in pw-table-memory|pw-core|pw-resource) ;; *) exit 2;; esac
          git diff origin/master...HEAD > changed.patch
          cargo mutants --package "$PACKAGE" --in-diff changed.patch --jobs 2 --timeout 90 | tee mutants-summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: rust-strength-pilot
          path: |
            coverage.txt
            changed.patch
            mutants-summary.txt
            mutants.out/
          if-no-files-found: ignore
          retention-days: 30
