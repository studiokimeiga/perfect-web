# Advisory stage: new scanner findings are first evaluated against Pleris's
# historical regressions and existing tailored mutation campaigns.
name: Quality analyzers

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Ruff (new-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.2"
          args: "--version"
      - name: Refuse newly introduced Ruff errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/quality_delta.py --base "$BASE_SHA"
      - name: Report existing Ruff baseline
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: ruff check --select E4,E7,E9,F --output-format github scripts research/failures/tools

  workflow-syntax:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The official versioned container includes shellcheck and pyflakes.
      - name: Check workflow expressions and shell
        id: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: "-color"
      - name: Record baseline status
        if: always()
        env:
          RESULT: ${{ steps.actionlint.outcome }}
        run: |
          echo "actionlint (required) outcome: $RESULT." >> "$GITHUB_STEP_SUMMARY"

  workflow-security:
    name: zizmor (baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Audit GitHub Actions security
        id: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        continue-on-error: true
        with:
          advanced-security: false
          min-severity: high
          min-confidence: high
          version: v1.30.1
      - name: Record baseline status
        if: always()
        env:
          RESULT: ${{ steps.zizmor.outcome }}
        run: |
          echo "zizmor advisory outcome: $RESULT; triage before making required." >> "$GITHUB_STEP_SUMMARY"
