# Advisory stage: new scanner findings are first evaluated against Pleris's
# historical regressions and existing tailored mutation campaigns.
name: Quality analyzers

on:
  pull_request:
    branches: [master]
  push:
    # Every branch CI builds, not only a pull request's head (2026-11-17): L5
    # lived on its branch for days with no pull request, so its first one
    # found 122 new Ruff findings that none of its pushes had been shown.
    branches: [master, "track/**", "wip/**"]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event too: a dispatch on a branch would otherwise cancel that
  # branch's push gate, which shows cancelled, not green (#128's review).
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Ruff (new-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: "--version"
      - name: Refuse newly introduced Ruff errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/quality_delta.py --base "$BASE_SHA"
      # A branch's push, against where it left master: what its pull request
      # would be refused for, before it has one.
      - name: Refuse Ruff errors a branch introduces since master
        if: github.event_name == 'push' && github.ref != 'refs/heads/master'
        # The base on its own line: a merge base that cannot be found stops
        # the step (bash -e), where a substitution inside the command would
        # hand it an empty base.
        run: |
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/quality_delta.py --base "$base"
      - name: Report existing Ruff baseline
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/master')
        continue-on-error: true
        run: ruff check --select E4,E7,E9,F --output-format github scripts research/failures/tools

  workflow-syntax:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official versioned container includes shellcheck and pyflakes.
      - name: Check workflow expressions and shell
        id: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: "-color"
      - name: Record baseline status
        if: always()
        env:
          RESULT: ${{ steps.actionlint.outcome }}
        run: |
          echo "actionlint (required) outcome: $RESULT." >> "$GITHUB_STEP_SUMMARY"

  workflow-security:
    name: zizmor (baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions security
        id: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        continue-on-error: true
        with:
          advanced-security: false
          min-severity: high
          min-confidence: high
          version: v1.30.1
      - name: Record baseline status
        if: always()
        env:
          RESULT: ${{ steps.zizmor.outcome }}
        run: |
          echo "zizmor advisory outcome: $RESULT; triage before making required." >> "$GITHUB_STEP_SUMMARY"
