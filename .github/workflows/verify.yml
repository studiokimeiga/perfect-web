# Heavy verification, off the laptop (ADR-0245).
#
# Evidence recipes — the tests, the mutation controls, the browser specs each
# one runs — sharded across parallel jobs, and the whole browser suite in
# each engine. A push runs the recipes its commits touch (the chain's
# choice, `scripts/ci_plan.py --changed`); the nightly run, every one, unless
# a push's or a nightly's run has succeeded at `master`'s head already
# (`scripts/nightly_skip.py`), and Sunday's, every one whatever has passed. A
# recipe's output is an artifact; `just evidence-fetch <run>` copies a run's
# evidence into docs/evidence/, each file naming the run that produced it.
#
# Linux, where the laptop is macOS: charter §13.5 asks for Linux CI, and a
# recipe that only passes on one of them is a finding. Measurements of the
# machine (`scripts/ci_plan.py`'s LOCAL_ONLY) stay on the development machine.
name: verify

on:
  pull_request:
    branches: [master]
  push:
    # A track's branch too (ADR-0253, docs/PARALLEL.md), for what it changed.
    branches: [master, "track/**"]
  schedule:
    # **The nightly is skipped where `master`'s head has a successful run
    # already** (track ci-diagnostics, 2026-10-20: 691 runner-hours in seven
    # days, 27% of all our CI, re-verifying a head `master` held for three
    # days): `scripts/nightly_skip.py` asks the GitHub API, and the plan job
    # below plans nothing, recipes and browsers, where a push's or an earlier
    # nightly's run succeeded at the exact commit. **Sunday's schedule is
    # never skipped**: it runs every recipe whatever has passed, so that slow
    # drift (a dependency's new advisory, a test that fails one run in
    # twenty) is met within a week. The strings here are the script's
    # `WEEKLY` and the weekday's, and a test holds them to it. A
    # `workflow_dispatch` is the override: it never asks, and with no
    # recipes named it runs every one.
    - cron: "17 6 * * 1-6"
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipes to run, space-separated; empty runs every one"
        required: false
        default: ""
      shards:
        description: "Shards, a database recipe's among them"
        required: false
        default: "17"

# **A track's later push covers its earlier ones** (ADR-0253, amended
# 2026-10-12). A track's push plans everything the track changed since it
# left `master` (its merge base, below), so its latest run covers every
# earlier one, and an earlier run still queued or running is cancelled for
# it. Until then none was, and query-params' three pushes ran three plans
# of nearly every recipe. A push to `master` plans its own commits, so no
# run of it covers another; it, the nightly and a dispatch, which plans the
# recipes it names, each have a group of their own and are never cancelled.
concurrency:
  group: verify-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/track/')) || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/track/')) || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  # Off, for the builds whose target Swatinem/rust-cache saves: "this action
  # automatically sets `CARGO_INCREMENTAL=0` to disable incremental
  # compilation, so that the Rust compiler doesn't waste time creating the
  # additional artifacts required for incremental builds", and the cache it
  # saves "is cleaned of ... Incremental build artifacts" (its README, `v2`;
  # `cleanTargetDir` keeps a profile's `build`, `.fingerprint` and `deps` and
  # removes the rest). A mutation script's mutants are another matter: see
  # `PW_MUTANT_INCREMENTAL`, on the `Recipes` step (track ci-diagnostics,
  # 2026-10-20).
  CARGO_INCREMENTAL: "0"
  # Debug info is most of a debug build's size, and nothing here debugs.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    # `actions: read`: a push to `master` reads which runs passed at what it
    # pushed (scripts/verified_base.py).
    permissions:
      contents: read
      actions: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # tools/versions.lock pins just 1.58.0; unpinned, the action installs
      # whatever release is newest (charter §3.6).
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RECIPES: ${{ inputs.recipes }}
          SHARDS: ${{ inputs.shards || '17' }}
          GH_TOKEN: ${{ github.token }}
          # Which schedule fired, for the nightly (scripts/nightly_skip.py).
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT" in
            push)
              # A track's push (ADR-0253): what the track changed since it left
              # `master`, at every push, in 9 shards, so that `master`'s runs
              # keep most of the plan's 20 jobs; in more where 9 would end past
              # the planner's ceiling (ADR-0290, amended 2026-10-10). Less each
              # recipe whose committed evidence is current, here and on
              # `master` (ADR-0281, amended 2026-10-13 (6)). And a train's
              # push, whose run's evidence its merge takes, plans each recipe
              # whose committed evidence is stale, whatever the train changed,
              # so that the run records it again (track evidence-integrity).
              if [ "${GITHUB_REF_NAME#track/}" != "$GITHUB_REF_NAME" ]; then
                base=$(git merge-base origin/master "$GITHUB_SHA")
                stale=""
                case "$GITHUB_REF_NAME" in track/train-*) stale="--stale" ;; esac
                # shellcheck disable=SC2086 # optional --stale flag is deliberately split
                python3 scripts/ci_plan.py --shards 9 --changed "$base" "$GITHUB_SHA" --current $stale >> "$GITHUB_OUTPUT"
              # The chain's choice, from the newest commit pushed that a run
              # passed at: a train verified at its head is not verified again
              # when `master` moves to it (ADR-0281, amended 2026-10-13). A
              # first push, with no commit before it, is planned whole.
              elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                base=$(python3 scripts/verified_base.py "$BEFORE" "$GITHUB_SHA")
                echo "planned from $base (the push's before: $BEFORE)"
                python3 scripts/ci_plan.py --shards 17 --changed "$base" "$GITHUB_SHA" --current >> "$GITHUB_OUTPUT"
                # And the browser suites, not again where only records
                # changed since the run that passed (the same amendment).
                if [ "$base" != "$BEFORE" ]; then
                  browsers=$(python3 scripts/verified_base.py --browsers "$base" "$GITHUB_SHA")
                  echo "browser suites: $browsers"
                  echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
                fi
              else
                python3 scripts/ci_plan.py --shards 17 --all >> "$GITHUB_OUTPUT"
              fi ;;
            pull_request)
              # Checkout is GitHub's test merge commit. Compare with the
              # actual merge base to include every change introduced by the
              # PR, regardless of how many commits were pushed.
              base=$(git merge-base "origin/$GITHUB_BASE_REF" "$GITHUB_SHA")
              python3 scripts/ci_plan.py --shards 9 --changed "$base" "$GITHUB_SHA" --current >> "$GITHUB_OUTPUT"
              git diff --name-only "$base" "$GITHUB_SHA" |
                python3 scripts/quality_scope.py --browser >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              # Skipped where a push's or a nightly's run has succeeded at
              # this exact commit, recipes and browser suites alike, and the
              # run's summary says which run it stands on; never on Sunday's
              # schedule, and never where the API cannot say
              # (scripts/nightly_skip.py).
              if why=$(python3 scripts/nightly_skip.py "$GITHUB_SHA" "$SCHEDULE"); then
                echo "$why"
                echo "$why" >> "$GITHUB_STEP_SUMMARY"
                echo "shards=[]" >> "$GITHUB_OUTPUT"
                echo "browsers=false" >> "$GITHUB_OUTPUT"
              else
                echo "$why"
                # 17 shards, a database recipe's among them, and three browser
                # jobs: the Free plan's 20 at once (ADR-0249, ADR-0278).
                python3 scripts/ci_plan.py --shards 17 --all >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              if [ -n "$RECIPES" ]; then
                # shellcheck disable=SC2086 # workflow-dispatch RECIPES is a space-separated list
                python3 scripts/ci_plan.py --shards "$SHARDS" $RECIPES >> "$GITHUB_OUTPUT"
              else
                python3 scripts/ci_plan.py --shards "$SHARDS" --all >> "$GITHUB_OUTPUT"
              fi ;;
          esac

  recipes:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    name: recipes ${{ matrix.shard.index }}${{ matrix.shard.database && ' on PostgreSQL' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # A recipe run against a database (ADR-0246) is a shard of its own, and
    # has this PostgreSQL to itself (ADR-0278): as the verified image runs
    # it, a throwaway database each run. Other shards start none: a service
    # whose image is empty does not start.
    services:
      postgres:
        image: ${{ matrix.shard.database && 'postgres:18.6' || '' }}
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: pw_feed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # A runner's disk is about 14 GB free. What it ships and nothing here
      # uses goes, some 25 GB: .NET, Android, GHC and CodeQL. In the
      # background, while the toolchain is set up (ADR-0249); a build waits
      # for it.
      - name: Free disk space
        run: |
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch /tmp/disk-freed' > /dev/null 2>&1 &
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          # One shard saves the cache, so sixteen do not race to write it.
          save-if: ${{ matrix.shard.index == 0 }}
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Koka and the Wasmtime CLI, each verified against its pinned SHA-256,
      # and the Node workspace.
      - name: Bootstrap pinned toolchain
        run: just bootstrap
      # Only a shard with a recipe that drives a browser installs them, and
      # only one with a recipe that reads the build builds (ADR-0249).
      - name: Browsers
        if: matrix.shard.browsers
        working-directory: spikes/own-renderer
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build
        if: matrix.shard.build
        run: |
          for _ in $(seq 150); do [ -e /tmp/disk-freed ] && break; sleep 2; done; df -h /
          cargo build --workspace --locked
          BUILD_ONLY=1 bash spikes/own-renderer/run.sh
          bash spikes/own-renderer/keyed-store.sh
          bash spikes/own-renderer/feed.sh
      - name: Recipes
        env:
          RECIPES: ${{ join(matrix.shard.recipes, ' ') }}
          DATABASE: ${{ matrix.shard.database && 'postgresql://postgres:pw@localhost:5432/pw_feed_test' || '' }}
          # **Each mutant of a mutation script is built incrementally**: it
          # undoes one line, so its build redoes what the line reaches, not a
          # crate whole (a one-line `pw-core` mutant's test binaries: 21 to 23
          # s against 33 to 37, on the PC at load 37; train-9's verify ran
          # 1,391 mutants). `scripts/mutation_baseline.py` removes
          # `CARGO_INCREMENTAL` from the script's environment and so from what
          # it starts, its recipe's own `CARGO_INCREMENTAL=0` with it (the
          # Mac's disk, 2026-09-24: no recipe's line is edited), so that
          # cargo's defaults apply: incremental for the dev and test profiles,
          # never for the `browser` profile's wasm (`CARGO_INCREMENTAL=1`
          # would force it there too). It removes the caches past 6 GiB
          # (`scripts/mutant_incremental.py`); `ci_recipes.py` removes them
          # between recipes. Nothing else of this job builds incrementally:
          # the `Build` step above fills the cache above's way.
          PW_MUTANT_INCREMENTAL: "1"
        run: |
          for _ in $(seq 150); do [ -e /tmp/disk-freed ] && break; sleep 2; done
          runner="$(lsb_release -ds) on GitHub Actions, $(uname -m)"
          # A shard without a database names none: its recipes run without.
          if [ -n "$DATABASE" ]; then
            export PW_FEED_DATABASE_URL="$DATABASE"
            runner="$runner, PostgreSQL 18.6"
          fi
          echo "$runner" > ci-out-runner.txt
          # shellcheck disable=SC2086 # names from the trusted plan are individual arguments
          python3 scripts/ci_recipes.py --out ci-out $RECIPES
          mv ci-out-runner.txt ci-out/runner.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.shard.index }}
          path: ci-out/
          retention-days: 90
      # A browser test that failed in a recipe keeps its trace, and what its
      # page's runtime and the network said beside it (feed.spec.mjs's
      # record): the evidence keeps the failure's name alone. Each run of a
      # suite clears `test-results/`, so that is the last run's. Every run
      # that failed is also copied, as it ends, to `kept-traces/<recipe>/
      # <time>/run-<i>/` (scripts/run_suite.sh, scripts/keep_traces.py), and
      # a mutation script's red baseline to `<script>-baseline/`
      # (scripts/mutation_baseline.py): 32 MiB at most in all, and none of a
      # mutation control's intended failures (track ci-diagnostics,
      # 2026-10-19: train-10's `traces-23` held only those, and lost the
      # Chromium failure of `e10-browser`'s second run).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traces-${{ matrix.shard.index }}
          path: |
            spikes/own-renderer/kept-traces/
            benchmarks/harness/kept-traces/
            spikes/own-renderer/test-results/
          if-no-files-found: ignore
          retention-days: 30

  browser:
    name: browser ${{ matrix.engine }}
    # Every push's, unless a run passed at the code it pushed and only the
    # records changed since (ADR-0281, amended 2026-10-13).
    needs: plan
    if: needs.plan.outputs.browsers != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      # A runner's disk is about 14 GB free. What it ships and nothing here
      # uses goes, some 25 GB: .NET, Android, GHC and CodeQL. In the
      # background, while the toolchain is set up (ADR-0249); a build waits
      # for it.
      - name: Free disk space
        run: |
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch /tmp/disk-freed' > /dev/null 2>&1 &
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just bootstrap
      - working-directory: spikes/own-renderer
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Build
        run: |
          for _ in $(seq 150); do [ -e /tmp/disk-freed ] && break; sleep 2; done
          cargo build --locked -p pw-cli -p pw-dev-server -p kiokun-server
          BUILD_ONLY=1 bash spikes/own-renderer/run.sh
          bash spikes/own-renderer/keyed-store.sh
          bash spikes/own-renderer/feed.sh
      - name: Suite
        working-directory: spikes/own-renderer
        run: pnpm exec playwright test --project=${{ matrix.engine }} --reporter=line
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-${{ matrix.engine }}
          # One run of the suite, so `test-results/` is the failing run's;
          # `kept-traces/` too, as the recipes' upload above has it.
          path: |
            spikes/own-renderer/test-results/
            spikes/own-renderer/kept-traces/
          retention-days: 30

  summary:
    needs: [plan, recipes]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.shards != '[]'
        with:
          pattern: evidence-*
          path: artifacts
      - env:
          SHARDS_JSON: ${{ needs.plan.outputs.shards }}
        run: |
          expected=$(python3 -c 'import json,os; print(len(json.loads(os.environ["SHARDS_JSON"])))')
          python3 scripts/ci_summary.py artifacts --shards "$expected"
