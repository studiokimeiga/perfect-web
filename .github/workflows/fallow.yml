name: Fallow

on:
  pull_request:
  # Every branch CI builds (2026-11-17), as quality.yml's Ruff gate: a branch
  # is shown what its pull request would be refused for before it has one.
  push:
    branches: ["track/**", "wip/**"]
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@34269241152fa2e7e6a9de1aba698dcae93035b3 # v3
        if: github.event_name == 'pull_request'
        with:
          command: audit
          version: 3.23.0
          gate: new-only
          fail-on-issues: true
      # A branch's push: the same gate, against where the branch left master.
      - name: The branch's base on master
        id: base
        if: github.event_name == 'push'
        run: echo "sha=$(git merge-base origin/master HEAD)" >> "$GITHUB_OUTPUT"
      - uses: fallow-rs/fallow@34269241152fa2e7e6a9de1aba698dcae93035b3 # v3
        if: github.event_name == 'push'
        with:
          command: audit
          version: 3.23.0
          gate: new-only
          fail-on-issues: true
          changed-since: ${{ steps.base.outputs.sha }}

  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # setup-node v5 caches for the package manager package.json names
          # (pnpm), and this job installs none: it runs `npx` alone.
          package-manager-cache: false
      - name: Generate full Fallow report
        # `--score`: fallow's combined mode computes the health score only
        # when asked (v3.23.0's `score: opts.score || opts.trend`), and
        # without it the summary's health read "n/a" from 38126d5c on.
        run: |
          set +e
          npx -y fallow@3.23.0 --score --format json --quiet > fallow-report.json
          status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Summarize health
        # Each figure is read where the report keeps it, and one that is
        # missing fails the step, rather than reading "n/a" or 0.
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("fallow-report.json", "utf8"));
          const f = {
            score: j.health?.health_score?.score,
            grade: j.health?.health_score?.grade,
            issues: j.check?.summary?.total_issues,
            dead: j.check?.summary?.unused_files,
            cycles: j.check?.summary?.circular_dependencies,
            duplication: j.dupes?.stats?.duplication_percentage,
          };
          const missing = Object.keys(f).filter((k) => f[k] === undefined || f[k] === null);
          if (missing.length > 0) {
            console.error(`fallow-report.json holds no ${missing.join(", ")}`);
            process.exit(1);
          }
          const text = `# Fallow weekly report\n\n- Health: **${f.score} ${f.grade}**\n- Issues: **${f.issues}**\n- Dead files: **${f.dead}**\n- Cycles: **${f.cycles}**\n- Duplication: **${Number(f.duplication).toFixed(1)}%**\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          console.log(text);
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fallow-weekly-report
          path: fallow-report.json
          retention-days: 30
