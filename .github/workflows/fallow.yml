name: Fallow

on:
  pull_request:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          version: 3.23.0
          gate: new-only
          fail-on-issues: true

  weekly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate full Fallow report
        run: |
          set +e
          npx -y fallow@3.23.0 --format json --quiet > fallow-report.json
          status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Summarize health
        run: |
          # shellcheck disable=SC2016 # JS template placeholders must reach Node unchanged
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("fallow-report.json","utf8")); const h=j.health?.health_score ?? {}; const s=j.check?.summary ?? {}; const d=j.dupes?.stats ?? {}; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `# Fallow weekly report\n\n- Health: **${h.score ?? "n/a"} ${h.grade ?? ""}**\n- Issues: **${s.total_issues ?? 0}**\n- Dead files: **${s.unused_files ?? 0}**\n- Cycles: **${s.circular_dependencies ?? 0}**\n- Duplication: **${Number(d.duplication_percentage ?? 0).toFixed(1)}%**\n`);'
      - uses: actions/upload-artifact@v7
        with:
          name: fallow-weekly-report
          path: fallow-report.json
          retention-days: 30
